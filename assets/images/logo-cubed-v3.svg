<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
    <g transform="translate(128, 140)">
        <!-- Isometric Cube Faces -->
        
        <!-- Right Face (Darkest) -->
        <path d="M0 0 L0 80 C0 95 10 105 25 112 L85 142 C100 150 110 145 110 130 V50 L0 0Z" fill="#111111"/>
        
        <!-- Left Face (Medium) -->
        <path d="M0 0 L0 80 C0 95 -10 105 -25 112 L-85 142 C-100 150 -110 145 -110 130 V50 L0 0Z" fill="#333333"/>
        
        <!-- Top Face (Lightest - Brand Face) -->
        <!-- Diamond shape with rounded corners at top and bottom interactions -->
        <path d="M0 0 L-110 -55 L0 -110 L110 -55 Z" fill="#444444"/>
        
        <!-- Dollar Sign on Top Face -->
        <!-- Skewed to match perspective -->
        <text x="0" y="-45" 
              font-family="Lexend, Arial, sans-serif" 
              font-size="80" 
              font-weight="bold" 
              fill="#FFFFFF" 
              text-anchor="middle" 
              dominant-baseline="central"
              transform="scale(1, 0.5)">
              $
        </text>
    </g>
</svg>
